<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="./css/style.css?v=130"><script type="module" src="./js/app.js?v=130"></script>

<body>

<main>
<section id="home-dashboard" class="home-dashboard">

</section>
<section id="inventory-page" class="inventory-page hidden"><div class="inventory-heading"><div><h2>МОЙ ИНВЕНТАРЬ</h2><p>Предметы, которые ты забрал из кейсов</p></div><span id="inventory-count">0 предметов</span></div><div id="inventory-grid" class="inventory-grid"></div></section>

<nav class="bottom-nav" aria-label="Навигация"><button class="active" data-page="cases"><span>📦</span>Кейсы</button><button data-page="upgrade"><span>⚡</span>Апгрейд</button><button data-page="inventory"><span>🎒</span>Инвентарь</button></nav>
