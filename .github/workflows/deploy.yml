name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/archive.part* | base64 --decode > /tmp/cs2-cases.zip
          unzip -t /tmp/cs2-cases.zip
          mkdir -p _site
          unzip -q /tmp/cs2-cases.zip -d /tmp/cs2-project
          cp -a /tmp/cs2-project/cs2-cases/. _site/
          test -f _site/index.html
          test -f _site/css/style.css
          test -f _site/js/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
