<!doctype html>
<html lang="ru">
<head>

<body>

<main>

<section class="case-catalog page-section" id="case-catalog">

<nav class="bottom-nav" aria-label="Навигация"><button data-tab="cases" class="active"><span>📦</span>Кейсы</button><button data-tab="inventory"><span>🎒</span>Инвентарь <i id="nav-inventory-count">0</i></button></nav>
