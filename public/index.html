<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c14"><title>CS2</title>
<link rel="stylesheet" href="./css/style.css?v=127"><script type="module" src="./js/app.js?v=127"></script>
</head>
<body>
<header class="topbar"><b class="logo" id="logo-home">CS<span>2</span></b><div class="top-actions"><div class="balance-pill"><span>💰</span><strong id="balance">1 000 ₽</strong></div><button class="topup-button" id="topup-open" type="button">＋ Пополнить</button></div></header>
<main>
<section class="case-catalog" id="case-catalog">
  <div class="cases-heading"><h2>КЕЙСЫ CS2</h2><span id="case-count">Загрузка кейсов…</span></div>
  <div class="case-catalog-grid" id="case-catalog-grid"><div class="case-catalog-loading">Загружаем каталог CS2…</div></div>
</section>
<section id="inventory-page" class="inventory-page hidden"><div class="inventory-heading"><div><h2>МОЙ ИНВЕНТАРЬ</h2><p>Предметы, которые ты забрал из кейсов</p></div><span id="inventory-count">0 предметов</span></div><div id="inventory-grid" class="inventory-grid"></div></section>
<section id="inventory-page" class="inventory-page hidden"><div class="cases-heading"><h2>ИНВЕНТАРЬ</h2><span id="inventory-count">0 предметов</span></div><div id="inventory-grid" class="inventory-grid"><p class="case-catalog-loading">Пока пусто. Открой кейс!</p></div></section>
</main>
<nav class="bottom-nav" aria-label="Основная навигация"><button class="active" id="nav-cases" type="button"><span>📦</span>Кейсы</button><button id="nav-inventory" type="button"><span>🎒</span>Инвентарь</button></nav>
<div class="modal hidden" id="topup-modal"><div class="dialog topup-dialog"><button class="close" id="topup-close" aria-label="Закрыть">×</button><div class="opening-top"><span class="opening-kicker">ВИРТУАЛЬНЫЙ БАЛАНС</span><h2>Пополнение</h2><p>Выбери количество игровых монет</p></div><div class="topup-options"><button data-topup="500">+500 ₽</button><button data-topup="1000">+1 000 ₽</button><button data-topup="2500">+2 500 ₽</button><button data-topup="5000">+5 000 ₽</button></div><p class="topup-note">Демо-режим: реальные платежи не выполняются.</p></div></div>
<nav class="bottom-nav" aria-label="Навигация"><button class="active" data-page="cases"><span>📦</span>Кейсы</button><button data-page="inventory"><span>🎒</span>Инвентарь</button></nav>

</body></html>
